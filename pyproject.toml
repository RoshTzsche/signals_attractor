[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signals-awakening"
version = "0.3.0"
description = "Causal multichannel EEG features and subject-held-out awakening forecasting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
eeg = ["mne>=1.6"]
dashboard = ["dash>=2.16", "dash-bootstrap-components>=1.5", "plotly>=5.18", "PyWavelets>=1.5", "mne>=1.6"]
test = ["pytest>=8"]

[project.scripts]
awakening = "awakening.cli:main"

[tool.setuptools.packages.find]
include = ["awakening*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

